[package]
name = "wsorb-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_camera", "bevy_light", "bevy_mesh", "bevy_pbr", "bevy_render", "bevy_shader", "bevy_window", "bevy_winit", "bevy_gizmos", "bevy_gizmos_render", "webgl2"] }
rapier3d-f64 = "=0.36.1"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "=0.2.121"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
