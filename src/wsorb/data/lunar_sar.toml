# Reference surrogate scenario: STP-style lunar search and rescue.
#
# Coordinates are local metres in the documented STU Lunar SAR search box
# (x: -317..1199, y: -718..796). Assets, charger and antennas sit in the
# surrounding world margin. Capabilities are campaign-level approximations of
# the STP entities, not the proprietary platform models.

id = "lunar_sar"
name = "Shackleton Lunar Search & Rescue"
description = """
A lander has gone down inside the south-polar search box. Seven surface assets
must find the crash site, keep comms, and report it before the mission clock
expires. The practice model draws on the STP Lunar SAR mission-manager API:
MoveToCoord, Stop, RotateToAzimuth, PickUpAntenna, PlaceDownAntenna, telemetry,
state of charge, comms and target-scan status.
"""
terrain_seed = 20261022
terrain_resolution_m = 20.0
horizon_s = 21600.0
dt_s = 15.0
charger_bays = 2
world_margin_m = 500.0
search_spacing_factor = 1.5
comms_check_interval_s = 30.0
relay_source_antenna = "ANT-1"

[bounds]
min_x = -317.154
max_x = 1199.211
min_y = -718.026
max_y = 795.979

[charger]
x = -250.0
y = -1060.0

